name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keystore cố định (JKS, base64) -> mọi bản build cùng chữ ký, cài đè/cập nhật được
  KEYSTORE_B64: ""
  KEYSTORE_PASSWORD: "wifishare123"
  KEY_ALIAS: "wifishare"
  KEY_PASSWORD: "wifishare123"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Giải nén project (nếu có file .zip ở thư mục gốc repo)
        id: src
        run: |
          set -e
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP" ]; then
            echo ">> Giải nén: $ZIP"
            rm -rf _src && mkdir _src
            unzip -q -o "$ZIP" -d _src
            SETTINGS=$(find _src -name settings.gradle.kts | head -n 1)
            ROOT=$(dirname "$SETTINGS")
          else
            ROOT=.
          fi
          test -f "$ROOT/settings.gradle.kts" || { echo "Không tìm thấy settings.gradle.kts"; exit 1; }
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo ">> Project root: $ROOT"
          ls -la "$ROOT" "$ROOT/app"

      - name: Ghi keystore
        run: echo "$KEYSTORE_B64" | base64 -d > "${{ steps.src.outputs.root }}/app/release.jks"

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Kiểm tra keystore
        run: keytool -list -keystore "${{ steps.src.outputs.root }}/app/release.jks" -storepass "$KEYSTORE_PASSWORD"

      - name: Chấp nhận license Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Cài Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK (release, đã ký)
        working-directory: ${{ steps.src.outputs.root }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WifiShare-apk
          path: ${{ steps.src.outputs.root }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
